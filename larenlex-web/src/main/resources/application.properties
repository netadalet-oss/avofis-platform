spring.application.name=LarenLex
spring.datasource.url=${LARENLEX_DB_URL:jdbc:postgresql://127.0.0.1:5432/larenlex}
spring.datasource.username=${LARENLEX_DB_USER:larenlex_app}
spring.datasource.password=${LARENLEX_DB_PASSWORD:}
spring.flyway.enabled=true
server.port=${PORT:8080}
vaadin.launch-browser=false
larenlex.catalog-dir=${LARENLEX_CATALOG_DIR:data}
server.error.include-message=never
server.error.include-stacktrace=never
