name: AVOfis S2 trusted minimal profiles in isolated PostgreSQL
on:
  push:
    branches:
      - seviye2-guvenlik-devam-20261031
  pull_request:
    paths:
      - 'database/staging/s2_profile_*'
      - 'tools/security/stage2-profile-provisioning.test.mjs'
      - '.github/workflows/seviye2-profile-provisioning.yml'
      - 'docs/security/SEVIYE2_PROFIL_GUVENLI_KAYIT_2026-10-31.md'
permissions:
  contents: read
jobs:
  synthetic-profiles-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify staging-only source and negative assertions
        run: node --test tools/security/stage2-profile-provisioning.test.mjs
      - name: Create disposable PostgreSQL profile test DB
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE avofis_s2_profile_test;"
      - name: Populate synthetic Auth and profile schema
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d avofis_s2_profile_test -v ON_ERROR_STOP=1 < database/staging/s2_profile_fixture.sql
      - name: Apply staging-only RLS and trusted grant proposal
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d avofis_s2_profile_test -v ON_ERROR_STOP=1 < database/staging/s2_profile_provisioning_draft.sql
      - name: Provision only synthetic A and B with basic role
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d avofis_s2_profile_test -v ON_ERROR_STOP=1 < database/staging/s2_profile_provisioning_seed.sql
      - name: Execute real PostgreSQL anonymous A-B and escalation denial tests
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d avofis_s2_profile_test -v ON_ERROR_STOP=1 < database/staging/s2_profile_ab_test.sql
