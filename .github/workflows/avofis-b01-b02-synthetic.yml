name: AVOfis B01-B02 - disposable PostgreSQL 17 security proofs
on:
  push:
    branches:
      - integration/avofis-birlesik-seviyeler-20261031
    paths:
      - 'database/**'
      - '.github/workflows/avofis-b01-b02-synthetic.yml'
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/avofis-b01-b02-synthetic.yml'
permissions:
  contents: read
jobs:
  staging-target-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Reject production project as a staging destination (offline)
        run: node --test database/tests/b03_staging_target_guard.test.mjs
  disposable-rls-and-cms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: avofis_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avofis_synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: avofis_synthetic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client (disposable test only)
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Prove B01 seven-table RLS and A/B isolation on synthetic users
        run: psql -v ON_ERROR_STOP=1 -f database/tests/legacy_rls_hardening.sql
      - name: Prove B02 CMS publication hold on synthetic roles
        run: psql -v ON_ERROR_STOP=1 -f database/tests/legacy_cms_publication_hold.sql
      - name: Prove B02 identity and CMS profile ACL repair with synthetic drift
        run: psql -v ON_ERROR_STOP=1 -f database/tests/identity_cms_profile_acl_hardening.sql
      - name: Prove separate future default privileges for synthetic owners
        run: psql -v ON_ERROR_STOP=1 -f database/tests/future_public_default_acl_owner_synthetic.sql
      - name: Confirm fail-closed, read-only postflight invariants
        run: |
          psql -v ON_ERROR_STOP=1 -f database/ops/identity_cms_future_acl_readonly_postflight.sql
          psql -v ON_ERROR_STOP=1 -f database/ops/b02_policy_readonly_postflight.sql
