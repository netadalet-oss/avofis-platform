name: AVOfis Seviye 1 - CMS mutation security
on:
  push:
    branches:
      - seviye1-yeniden-baslangic-20261031
  pull_request:
    paths:
      - 'api/src/modules/cms/**'
      - 'api/src/lib/cms-write-gate.ts'
      - 'api/tests/cms-write-gate.test.mjs'
      - '.github/workflows/seviye1-cms-security.yml'
permissions:
  contents: read
jobs:
  cms-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Native HTTP negative security tests
        run: node --experimental-strip-types --test api/tests/cms-write-gate.test.mjs
      - name: Install workspaces
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript API build
        run: npm run build:api
