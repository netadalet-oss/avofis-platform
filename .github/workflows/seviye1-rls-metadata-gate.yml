name: AVOfis Seviye 1 - RLS metadata preflight
on:
  push:
    branches:
      - seviye1-yeniden-baslangic-20261031
    paths:
      - 'tools/security/rls-preflight.mjs'
      - 'tools/security/rls-preflight.test.mjs'
      - '.github/workflows/seviye1-rls-metadata-gate.yml'
  pull_request:
    paths:
      - 'tools/security/rls-preflight.mjs'
      - 'tools/security/rls-preflight.test.mjs'
      - '.github/workflows/seviye1-rls-metadata-gate.yml'
permissions:
  contents: read
jobs:
  rls-metadata-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test offline RLS audit and blocked-release cases
        run: node --test tools/security/rls-preflight.test.mjs
