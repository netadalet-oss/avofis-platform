name: LarenLex L6 source tests and unsigned Android Java compilation
on:
  push:
    branches: [work/larenlex-android]
    paths:
      - 'larenlex-android/l6/**'
      - '.github/workflows/larenlex-l6-source-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: L6 source and JVM regressions
        working-directory: larenlex-android/l6
        run: python -m unittest discover -s tests -v
      - name: Static manifest and source audit
        working-directory: larenlex-android/l6
        run: python tools/audit_l6.py --output /tmp/larenlex-l6-audit.json
      - name: Evidence boundary
        run: echo 'Not A5.18 provenance, real A2 acceptance, A6 devices or A7 release.'
  android-java-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile source only; no APK or signing
        working-directory: larenlex-android/l6/android
        run: gradle --no-daemon --console=plain :app:compileDebugJavaWithJavac
      - name: Evidence boundary
        run: echo 'Java compile is not an APK, signed release, A6 acceptance or A7 publication.'
