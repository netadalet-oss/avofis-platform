name: LarenLex L6 source tests and unsigned APK package verification
on:
  push:
    branches: [work/larenlex-android]
    paths:
      - 'larenlex-android/l6/**'
      - '.github/workflows/larenlex-l6-source-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: L6 source and JVM regressions
        working-directory: larenlex-android/l6
        run: python -m unittest discover -s tests -v
      - name: Static manifest and source audit
        working-directory: larenlex-android/l6
        run: python tools/audit_l6.py --output /tmp/larenlex-l6-audit.json
      - name: Evidence boundary
        run: echo 'Not A5.18 provenance, real A2 acceptance, A6 devices or A7 release.'
  android-java-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK 35 (no license prompts or downloads)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then echo 'Android SDK environment variable unavailable'; exit 1; fi
          echo "Android SDK root: $SDK"
          test -f "$SDK/platforms/android-35/android.jar" || { echo 'Android API 35 platform missing'; exit 1; }
          test -x "$SDK/build-tools/35.0.0/aapt" || { echo 'Android build-tools 35.0.0 missing'; exit 1; }
          echo 'Preinstalled SDK 35 is available; no SDK installation attempted.'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
          cache-cleanup: never
      - name: Compile source only; retry once only on dependency HTTP 429
        shell: bash
        working-directory: larenlex-android/l6/android
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            log="${RUNNER_TEMP}/larenlex-gradle-attempt-${attempt}.log"
            echo "Gradle Java compilation, attempt ${attempt}/2"
            if gradle --no-daemon --console=plain --max-workers=2 :app:compileDebugJavaWithJavac > "$log" 2>&1; then
              cat "$log"
              echo 'Android Java compilation PASS; no APK or device test performed.'
              exit 0
            fi
            cat "$log"
            if [ "$attempt" -eq 1 ] && grep -Eiq 'Received status code 429|Too Many Requests' "$log"; then
              echo 'Dependency server rate-limited this build; one bounded retry after 45 seconds.'
              sleep 45
            else
              echo 'Build failed: no automatic retry for source errors or after second attempt.'
              exit 1
            fi
          done
      - name: Package unsigned release APK (structural inspection only)
        working-directory: larenlex-android/l6/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --max-workers=2 :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK" || { echo 'Unsigned APK missing'; exit 1; }
          unzip -tqq "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -x "$SDK/build-tools/35.0.0/aapt"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='nl.larenlex.app'"
          unzip -Z1 "$APK" | grep -Fqx "classes.dex"

          if "$SDK/build-tools/35.0.0/apksigner" verify "$APK" >/tmp/larenlex-apk-signature-check.log 2>&1; then
            echo 'Unexpectedly signed APK: refusing to publish artifact'; exit 1
          fi
          echo 'APK intentionally unsigned and cannot be installed without separately authorized signing.'
          sha256sum "$APK" | tee unsigned-apk-sha256.txt
      - name: Archive unsigned package for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: larenlex-l6-unsigned-not-installable
          path: |
            larenlex-android/l6/android/app/build/outputs/apk/release/app-release-unsigned.apk
            larenlex-android/l6/android/unsigned-apk-sha256.txt
          if-no-files-found: error
          retention-days: 3
      - name: Evidence boundary
        run: echo 'Unsigned APK packaging is not installable, signed, device-tested, legally approved or published.'
  android-debug-package:
    name: Temporary debug-signed APK for installation inspection (not release)
    needs: [source-tests, android-java-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify existing SDK (no license prompt)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          test -x "$SDK/build-tools/35.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
          cache-cleanup: never
      - name: Build debug-only APK with temporary runner debug certificate
        shell: bash
        working-directory: larenlex-android/l6/android
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --max-workers=2 :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -Z1 "$APK" | grep -Fqx classes.dex
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='nl.larenlex.app'"
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "application-label:'LarenLex'"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > debug-cert-report.txt
          grep -F 'CN=Android Debug' debug-cert-report.txt
          sha256sum "$APK" | tee debug-apk-sha256.txt
          echo 'DEBUG-ONLY APK. Do not use with actual client data or production accounts.'
      - uses: actions/upload-artifact@v4
        with:
          name: larenlex-l6-debug-installable-not-release
          path: |
            larenlex-android/l6/android/app/build/outputs/apk/debug/app-debug.apk
            larenlex-android/l6/android/debug-apk-sha256.txt
            larenlex-android/l6/android/debug-cert-report.txt
          if-no-files-found: error
          retention-days: 3
      - name: Evidence boundary
        run: echo 'Debug signing only. No production keystore, store upload, A6 device run, legal or A7 acceptance.'
