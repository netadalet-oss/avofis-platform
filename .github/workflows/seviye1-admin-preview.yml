name: AVOfis S1 whole-product admin preview
on:
  pull_request:
    paths:
      - "admin/src/app/seviye-1-onizleme/**"
      - "admin/src/app/page.tsx"
      - "admin/tests/whole-product-admin-preview.test.cjs"
      - ".github/workflows/seviye1-admin-preview.yml"
  push:
    branches:
      - work/avofis-uygulama-s1-20261031
    paths:
      - "admin/src/app/seviye-1-onizleme/**"
      - "admin/src/app/page.tsx"
      - "admin/tests/whole-product-admin-preview.test.cjs"
      - ".github/workflows/seviye1-admin-preview.yml"
permissions:
  contents: read
jobs:
  build-and-http-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.invalid"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "synthetic-ci-only-not-a-real-key"
    steps:
      - name: Checkout reviewed exact code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install without dependency scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Admin all-module source regressions
        run: npm --workspace admin run test
      - name: Build actual Next.js admin application
        run: npm run build:admin
      - name: HTTP verify safe full-product admin preview
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace admin run start > /tmp/avofis-admin-stage1-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3001/seviye-1-onizleme > /tmp/avofis-admin-s1.html; then break; fi
            sleep 1
          done
          test -s /tmp/avofis-admin-s1.html
          grep -q 'Yönetim, API ve personel ana modülleri' /tmp/avofis-admin-s1.html
          grep -q '16 personel modülünün ana noktaları' /tmp/avofis-admin-s1.html
          grep -q '14 API modül iskeleti' /tmp/avofis-admin-s1.html
          grep -q '0/594 bağımsız R kabul' /tmp/avofis-admin-s1.html
          grep -q 'noindex' /tmp/avofis-admin-s1.html
          if grep -Eq 'type="password"|<form' /tmp/avofis-admin-s1.html; then
            echo 'Unexpected personal-data input in preview' >&2
            exit 1
          fi
          echo 'Whole product admin preview HTTP: PASS'
